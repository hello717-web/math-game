<!DOCTYPE.html>
<h2 align="center">MISSION 2-1</h2>
<p align="center">
Trova il numero di due cifre tale che:<br>
- La somma delle cifre è 9<br>
- È divisibile per 3<br>
- È maggiore di 50
</p>

<div align="center">
  <input type="text" id="numero" placeholder="inserisci il numero">
  <button onclick="verificaNumero()">Verifica</button>
</div>

<p id="risultato" align="center"></p>
<script>
function verificaNumero() {
  let n = document.getElementById("numero").value;

  if (n == 63 || n == 54 || n == 72 || n == 81 || n == 90) {
    document.getElementById("risultato").innerHTML =
      "CORRECT 🏆 <a href='https://hello717-web.github.io/math-game/index.html'>BACK</a>";
  } else {
    document.getElementById("risultato").innerText =
      "wrong 💀";
  }
}
</script>
